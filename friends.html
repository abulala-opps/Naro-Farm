<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友链 · naro 的数字农场</title>
<link rel="stylesheet" href="style.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        background: linear-gradient(160deg, #FDF8F0 0%, #F5EDE0 100%);
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #3E3A36;
        line-height: 1.8;
        padding-bottom: 80px;
    }

    /* ===== 顶部朴素 banner（和简介页一致） ===== */
    .top-banner {
        position: relative;
        width: 100%;
        height: 180px;
        padding-top: 70px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg,
            #FDF8F0 0%,
            #F0EDE0 50%,
            #E6E6D5 100%);
        border-bottom: 1px solid rgba(139, 111, 71, 0.08);
    }

    .banner-title {
        color: #6B8E4E;
        font-size: 30px;
        letter-spacing: 4px;
        font-weight: bold;
        text-align: center;
        animation: fadeInDown 0.8s ease-out both;
    }

    .banner-subtitle {
        color: #A89880;
        font-size: 14px;
        letter-spacing: 2px;
        text-align: center;
        margin-top: 8px;
        animation: fadeInDown 0.8s ease-out 0.2s both;
    }

    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-15px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== 中间大图（纯展示） ===== */
    .banner-image {
        width: 100%;
        height: 360px;
        overflow: hidden;
        position: relative;
    }
    .banner-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        animation: fadeIn 1.2s ease-out 0.3s both;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    /* ===== 友链卡片区 ===== */
    .friends-container {
        position: relative;
        z-index: 3;
        max-width: 1000px;
        margin: -40px auto 0;         /* 卡片轻微压在图上 */
        padding: 0 40px;
    }

    .friend-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 24px;
        padding: 36px;
        box-shadow: 0 12px 40px rgba(139, 111, 71, 0.15);
        animation: fadeInUp 0.8s ease-out 0.5s both;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* 单个友链卡片 */
    .friend-card {
        display: flex;
        align-items: center;
        gap: 18px;
        background: rgba(255, 255, 255, 0.75);
        border-radius: 16px;
        padding: 20px 24px;
        text-decoration: none;
        color: inherit;
        box-shadow: 0 4px 16px rgba(139, 111, 71, 0.08);
        transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }
    .friend-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 28px rgba(139, 111, 71, 0.18);
        background: rgba(255, 255, 255, 0.95);
    }

    .friend-avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        border: 3px solid rgba(107, 142, 78, 0.15);
        background: rgba(107, 142, 78, 0.08);
        transition: border-color 0.3s, transform 0.3s;
    }
    .friend-card:hover .friend-avatar {
        border-color: #E67E22;
        transform: scale(1.08) rotate(-3deg);
    }

    .friend-info { min-width: 0; }
    .friend-info .friend-name {
        font-size: 17px;
        font-weight: bold;
        color: #6B8E4E;
        margin-bottom: 4px;
    }
    .friend-info .friend-desc {
        font-size: 13px;
        color: #A89880;
        line-height: 1.6;
    }

    /* ===== 底部提示 ===== */
    .growing-tip {
        text-align: center;
        margin-top: 60px;
        color: #A89880;
        font-size: 15px;
    }
    .growing-tip::before {
        content: "🌱 ";
    }

    /* ===== 响应式 ===== */
    @media (max-width: 900px) {
        .top-banner { height: 150px; }
        .banner-title { font-size: 24px; }
        .banner-image { height: 220px; }
        .friends-container { padding: 0 24px; margin-top: -30px; }
        .friend-list {
            grid-template-columns: 1fr;
            padding: 24px;
        }
    }

    /* ===== 运行时长计时条 ===== */
    .uptime-bar {
        text-align: center;
        margin-top: 24px;
        color: #A89880;
        font-size: 14px;
        padding: 10px 22px;
        animation: fadeInUp 0.8s ease-out 0.4s both;
    }
    .uptime-bar span {
        color: #E67E22;
        font-weight: bold;
    }
</style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="top-nav">
        <a href="index.html">首页</a>
        <a href="about.html">简介</a>
        <a href="projects.html">项目</a>
        <a href="blog.html">日志</a>
        <a href="friends.html" class="active">友链</a>
    </nav>

    <!-- 顶部朴素 banner（和简介页一致） -->
    <div class="top-banner">
        <h1 class="banner-title">友情链接</h1>
        <p class="banner-subtitle">这里是我的朋友们</p>
    </div>

    <!-- 中间大图（纯展示） -->
    <div class="banner-image">
        <img src="images/naro_background.png" alt="农场花田">
    </div>

    <!-- 友链卡片区 -->
    <div class="friends-container">
         <div class="friend-list">

            <a href="#" class="friend-card" target="_blank" rel="noopener">
                <img class="friend-avatar" src="images/naro.png" alt="好友头像">
                <div class="friend-info">
                    <div class="friend-name">朋友 A</div>
                    <div class="friend-desc">一句话介绍他/她。</div>
                </div>
            </a>

            <a href="#" class="friend-card" target="_blank" rel="noopener">
                <img class="friend-avatar" src="images/naro.png" alt="好友头像">
                <div class="friend-info">
                    <div class="friend-name">朋友 B</div>
                    <div class="friend-desc">一句话介绍他/她。</div>
                </div>
            </a>

            <a href="#" class="friend-card" target="_blank" rel="noopener">
                <img class="friend-avatar" src="images/naro.png" alt="好友头像">
                <div class="friend-info">
                    <div class="friend-name">朋友 C</div>
                    <div class="friend-desc">一句话介绍他/她。</div>
                </div>
            </a>

            <a href="#" class="friend-card" target="_blank" rel="noopener">
                <img class="friend-avatar" src="images/naro.png" alt="好友头像">
                <div class="friend-info">
                    <div class="friend-name">朋友 D</div>
                    <div class="friend-desc">一句话介绍他/她。</div>
                </div>
            </a>

        </div>

        <p class="growing-tip">以后会有更多朋友来农场做客</p>

        <!-- 运行时长计时 -->
                <div class="uptime-bar">
                    这个网站已经运行了 <span id="uptime">计算中……</span>
                </div>


    </div>

    <script>
        // ========== 运行时长计时 ==========
        const SITE_START = new Date('2026-09-01T00:00:00');
        const uptimeEl = document.getElementById('uptime');

        function updateUptime() {
            const now = new Date();
            let diff = Math.floor((now - SITE_START) / 1000);

            if (diff < 0) {
                uptimeEl.textContent = '刚刚种下';
                return;
            }

            const days = Math.floor(diff / 86400);
            diff %= 86400;
            const hours = Math.floor(diff / 3600);
            diff %= 3600;
            const minutes = Math.floor(diff / 60);
            const seconds = diff % 60;

            uptimeEl.textContent = `${days} 天 ${hours} 时 ${minutes} 分 ${seconds} 秒`;
        }

        updateUptime();
        setInterval(updateUptime, 1000);
    </script>

</body>
</html>
