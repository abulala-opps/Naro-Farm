<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的数字农场</title>
<link rel="stylesheet" href="style.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        overflow-x: hidden;            /* 只禁横向滚动，允许纵向 */
        background: #d9ead3;
    }

    /* ===== 顶部 banner ===== */
    .top-banner {
        position: relative;
        width: 100%;
        height: 180px;
        padding-top: 70px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg,
            #FDF8F0 0%,
            #F0EDE0 50%,
            #E6E6D5 100%);
        border-bottom: 1px solid rgba(139, 111, 71, 0.08);
        z-index: 10;
    }

    .banner-title {
        color: #6B8E4E;
        font-size: 30px;
        letter-spacing: 4px;
        font-weight: bold;
        animation: fadeInDown 0.8s ease-out both;
    }

    .banner-subtitle {
        color: #A89880;
        font-size: 14px;
        letter-spacing: 2px;
        margin-top: 8px;
        animation: fadeInDown 0.8s ease-out 0.2s both;
    }

    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-15px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== 舞台：图片和 canvas 完全重叠 ===== */
    #farm {
        position: relative;
        width: 100%;
        height: 100vh;                 /* 农场图占满一屏 */
        overflow: hidden;
    }

    /* 农场图上的暗色遮罩 */
    #farm::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.18);   /* 18% 黑色，淡淡的 */
        pointer-events: none;              /* 不挡点击（重要！） */
        z-index: 4;                        /* 在背景图之上，文字之下 */
    }

    #bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        user-select: none;
        pointer-events: none;
        image-rendering: -webkit-optimize-contrast;
    }

    /* canvas 盖在图片上面，完全透明 */
    #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
    }

    /* 提示文字 */
    #tip {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(255, 255, 255, 0.8);
        color: #2E7D32;
        padding: 8px 18px;
        border-radius: 999px;
        font-size: 14px;
        pointer-events: none;
    }

    /* 计数 */
    #counter {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.8);
        color: #2E7D32;
        padding: 8px 16px;
        border-radius: 999px;
        font-weight: bold;
    }

    /* ===== 欢迎文字 ===== */
    #welcome {
        position: absolute;
        top: 32%;
        left: 50%;
        transform: translate(-50%,-50%);
        z-index: 20;
        pointer-events: none;

        font-size: 52px;
        font-weight: bold;
        color: #fff;
        text-shadow:
            0 4px 20px rgba(0, 0, 0, 0.35),
            0 2px 6px rgba(0, 0, 0, 0.25);
        letter-spacing: 6px;
        white-space: nowrap;
        text-align: center;     

    }

    #welcome .name {
        color: #FFE082;
        font-size: 1.3em;
        margin: 0 10px;
        display: inline-block;
        animation: namePulse 2s ease-in-out infinite;
    }

    @keyframes namePulse {
        0%, 100% {
            transform: scale(1);
            filter: drop-shadow(0 0 8px rgba(255, 224, 130, 0.6));
        }
        50% {
            transform: scale(1.08);
            filter: drop-shadow(0 0 18px rgba(255, 224, 130, 0.95));
        }
    }

    /* ===== 樱花容器 ===== */
    #sakura {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 5;
    }

    .sakura-petal {
        position: absolute;
        top: -30px;
        width: 14px;
        height: 14px;
        background: radial-gradient(circle at 30% 30%, #FFE4EC, #FFB7C5 60%, #F48FB1);
        border-radius: 50% 0 50% 50%;
        opacity: 0.9;
        animation: sakuraFall linear infinite;
        will-change: transform;
    }

    @keyframes sakuraFall {
        0%   { transform: translateY(-30px) translateX(0) rotate(0deg); opacity: 0; }
        10%  { opacity: 0.9; }
        90%  { opacity: 0.9; }
        100% { transform: translateY(105vh) translateX(60px) rotate(360deg); opacity: 0; }
    }

    /* 下滑提示 */
    .scroll-tip {
        margin-top: 24px;
        font-size: 18px;
        color: #fff;
        letter-spacing: 3px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        opacity: 0;
        animation: fadeInUp 1s ease-out 2.2s forwards;
        /* 小小的上下浮动，像"呼吸" */
        animation: fadeInUp 1s ease-out 2.2s forwards,
                tipFloat 2.5s ease-in-out 3.2s infinite;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes tipFloat {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(6px); }
    }

    /* 下滑小箭头（可选） */
    .scroll-tip::after {
        content: " ↓";
        display: inline-block;
        animation: arrowBounce 1.5s ease-in-out infinite;
    }

    @keyframes arrowBounce {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(4px); }
    }

    /* 打字文本 */
    #typingText {
        display: inline-block;
    }

    /* 打字光标 */
    .cursor {
        display: inline-block;
        color: #FFE082;
        font-weight: normal;
        margin-left: 4px;
        animation: blink 0.8s step-end infinite;
    }
    @keyframes blink {
        50% { opacity: 0; }
    }
</style>
</head>
<body>

    <!-- 顶部 banner -->
    <div class="top-banner">
        <h1 class="banner-title">naro 的农场</h1>
        <p class="banner-subtitle">一个正在生长的小世界</p>
    </div>

    <!-- 农场舞台 -->
    <div id="farm">
        <img id="bg" src="images/farm (2).png" alt="数字农场">

        <nav class="top-nav">
            <a href="index.html" class="active">首页</a>
            <a href="about.html">简介</a>
            <a href="projects.html">项目</a>
            <a href="blog.html">日志</a>
            <a href="friends.html">友链</a>
        </nav>

        <div id="counter">🐾 动物：0 只</div>
        <div id="tip">在围栏内点击，放一只小动物</div>

        <canvas id="canvas"></canvas>

        <div id="welcome">
            <div class="welcome-line">
                <span id="typingText"></span>
                <span class="cursor">|</span>
            </div>
            <p class="scroll-tip">下滑屏幕，给农场留下你的小动物吧 ↓</p>
        </div>

        <div id="sakura"></div>
    </div>

<script>
    // ========== 1. 动物图片列表 ==========
    const spritePaths = [
        'images/cat.3.png',
        'images/cattle1.png',
        'images/cattle2.png',
        'images/pig1.png',
        'images/pig2.png',
        'images/sheep1.png',
        'images/sheep2.png',
    ];

    const animalSprites = [];

    // ========== 2. 等所有图片加载完 ==========
    Promise.all(spritePaths.map(path => {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => {
                console.error('图片加载失败：', path);
                reject(path);
            };
            img.src = path;
        });
    })).then(imgs => {
        animalSprites.push(...imgs);
        console.log('✅ 所有动物图片加载完成，共', animalSprites.length, '张');
    }).catch(err => {
        console.error('❌ 有图片加载失败：', err);
    });

    // ========== 3. Canvas 基础设置 ==========
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const counter = document.getElementById('counter');

    let W = 0, H = 0;

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        // 用 farm 容器的尺寸（不是 window）
        const rect = canvas.getBoundingClientRect();
        W = rect.width;
        H = rect.height;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ========== 4. 围栏区域（百分比坐标） ==========
    const fencePolygon = [
        { x: 0.08, y: 0.62 },
        { x: 0.68, y: 0.52 },
        { x: 0.98, y: 0.98 },
        { x: 0.03, y: 0.98 },
    ];

    function isInsideFence(nx, ny) {
        const poly = fencePolygon;
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, yi = poly[i].y;
            const xj = poly[j].x, yj = poly[j].y;
            const intersect = ((yi > ny) !== (yj > ny)) &&
                (nx < (xj - xi) * (ny - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    // ========== 5. 动物数据 ==========
    const animals = [];

    // ========== 6. 点击生成动物 ==========
    canvas.addEventListener('click', function(e) {
        if (animalSprites.length === 0) return;

        const rect = canvas.getBoundingClientRect();
        const screenX = e.clientX - rect.left;
        const screenY = e.clientY - rect.top;

        const nx = screenX / W;
        const ny = screenY / H;

        if (!isInsideFence(nx, ny)) {
            console.log('点击在围栏外，忽略');
            return;
        }

        animals.push({
            x: nx,
            y: ny,
            vx: (Math.random() - 0.5) * 0.002,
            vy: (Math.random() - 0.5) * 0.002,
            scale: 0.7 + Math.random() * 0.5,
            sprite: animalSprites[Math.floor(Math.random() * animalSprites.length)],
            facing: 1,
        });

        counter.textContent = '🐾 动物：' + animals.length + ' 只';
    });

    // ========== 7. 更新动物位置 ==========
    function updateAnimals() {
        for (const a of animals) {
            a.x += a.vx;
            a.y += a.vy;

            if (a.x < 0.06 || a.x > 0.95) a.vx *= -1;
            if (a.y < 0.55 || a.y > 0.95) a.vy *= -1;

            if (a.vx < -0.0001) a.facing = -1;
            else if (a.vx > 0.0001) a.facing = 1;
        }
    }

    // ========== 8. 画动物 ==========
    function drawAnimals() {
        for (const a of animals) {
            const baseH = 80;
            const h = baseH * a.scale;
            const w = h * (a.sprite.width / a.sprite.height);
            const px = a.x * W;
            const py = a.y * H;

            ctx.save();

            // 影子
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(px, py + h * 0.4, w * 0.35, h * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();

            // 朝向翻转
            if (a.facing === -1) {
                ctx.translate(px, py);
                ctx.scale(-1, 1);
                ctx.drawImage(a.sprite, -w / 2, -h / 2, w, h);
            } else {
                ctx.drawImage(a.sprite, px - w / 2, py - h / 2, w, h);
            }

            ctx.restore();
        }
    }

    // ========== 9. 动画循环 ==========
    function loop() {
        ctx.clearRect(0, 0, W, H);
        updateAnimals();
        drawAnimals();
        requestAnimationFrame(loop);
    }

    loop();

    // ========== 樱花飘落特效 ==========
    function createSakura() {
        const container = document.getElementById('sakura');
        const PETAL_COUNT = 25;

        for (let i = 0; i < PETAL_COUNT; i++) {
            const petal = document.createElement('div');
            petal.className = 'sakura-petal';

            petal.style.left = Math.random() * 100 + '%';

            const size = 8 + Math.random() * 10;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';

            const duration = 8 + Math.random() * 8;
            petal.style.animationDuration = duration + 's';

            petal.style.animationDelay = Math.random() * 10 + 's';
            petal.style.opacity = 0.5 + Math.random() * 0.5;

            container.appendChild(petal);
        }
    }

    createSakura();

    // ========== 打字机效果 ==========
    const typingText = document.getElementById('typingText');
    const fullText = '欢迎来到 naro 的农场';
    let charIndex = 0;
    const TYPING_SPEED = 120;   // 每个字的间隔毫秒

    function typeNextChar() {
        if (charIndex < fullText.length) {
            typingText.textContent += fullText.charAt(charIndex);
            charIndex++;
            setTimeout(typeNextChar, TYPING_SPEED);
        } else {
            // 打完后隐藏光标
            const cursor = document.querySelector('.cursor');
            if (cursor) cursor.style.opacity = '0';
        }
    }

    // 页面加载完 0.8 秒后开始打字
    window.addEventListener('load', () => {
        setTimeout(typeNextChar, 800);
    });
</script>
</body>
</html>
