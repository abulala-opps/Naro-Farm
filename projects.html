<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目 · naro 的数字农场</title>
<link rel="stylesheet" href="style.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        background: linear-gradient(160deg, #FDF8F0 0%, #F5EDE0 100%);
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #3E3A36;
        line-height: 1.8;
        padding-bottom: 80px;
    }

    /* ===== 顶部朴素 banner（和简介页一致） ===== */
    .top-banner {
        position: relative;
        width: 100%;
        height: 180px;
        padding-top: 70px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg,
            #FDF8F0 0%,
            #F0EDE0 50%,
            #E6E6D5 100%);
        border-bottom: 1px solid rgba(139, 111, 71, 0.08);
    }

    .banner-title {
        color: #6B8E4E;
        font-size: 30px;
        letter-spacing: 4px;
        font-weight: bold;
        text-align: center;
        animation: fadeInDown 0.8s ease-out both;
    }

    .banner-subtitle {
        color: #A89880;
        font-size: 14px;
        letter-spacing: 2px;
        text-align: center;
        margin-top: 8px;
        animation: fadeInDown 0.8s ease-out 0.2s both;
    }

    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-15px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== 主容器 ===== */
    .projects-container {
        max-width: 1000px;
        margin: 60px auto 0;
        padding: 0 40px;
    }

    /* 卡片网格 */
    .projects-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
    }

    /* ===== 项目卡片 ===== */
    .project-card {
        display: block;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(139, 111, 71, 0.1);
        transition: transform 0.4s ease, box-shadow 0.4s ease;
        animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    .project-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 32px rgba(139, 111, 71, 0.2);
    }

    /* 封面图 */
    .project-cover {
        width: 100%;
        height: 160px;
        overflow: hidden;
        background: linear-gradient(160deg, #F5EDE0 0%, #E8DDC8 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .project-cover img {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border-radius: 20px;
        box-shadow: 0 6px 18px rgba(139, 111, 71, 0.15);
        filter: grayscale(1);
        transition: filter 0.6s ease, transform 0.6s ease;
    }
    .project-card:hover .project-cover img {
        filter: grayscale(0);
        transform: scale(1.1);
    }

    /* 卡片内容 */
    .project-info {
        padding: 24px 28px 28px;
    }
    .project-info h3 {
        font-size: 22px;
        color: #6B8E4E;
        margin-bottom: 6px;
    }
    .project-info .project-type {
        color: #A89880;
        font-size: 14px;
        margin-bottom: 14px;
    }
    .project-info .project-desc {
        color: #5A5248;
        font-size: 15px;
        line-height: 1.7;
        margin-bottom: 18px;
    }

    /* 状态徽章 */
    .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: bold;
    }
    .status-paused {
        background: rgba(255, 193, 7, 0.15);
        color: #B8860B;
    }
    .status-coming {
        background: rgba(107, 142, 78, 0.15);
        color: #6B8E4E;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== 占位卡片 ===== */
    .project-card-placeholder {
        cursor: default;
        animation: fadeInUp 0.8s ease-out 0.6s both;
        opacity: 0.85;
    }
    .project-card-placeholder:hover {
        transform: none;
        box-shadow: 0 4px 20px rgba(139, 111, 71, 0.1);
    }

    .placeholder-icon {
        font-size: 48px;
        filter: grayscale(1);
        opacity: 0.7;
        transition: filter 0.6s ease, opacity 0.6s ease;
    }
    .project-card-placeholder:hover .placeholder-icon {
        filter: grayscale(0);
        opacity: 1;
    }

    /* ===== 底部说明 ===== */
    .growing-tip {
        text-align: center;
        margin-top: 60px;
        color: #A89880;
        font-size: 15px;
        animation: fadeInUp 0.8s ease-out 0.8s both;
    }
    .growing-tip::before {
        content: "🌱 ";
    }

    /* ===== 响应式 ===== */
    @media (max-width: 900px) {
        .top-banner { height: 150px; }
        .banner-title { font-size: 24px; }
        .projects-container { margin-top: 40px; padding: 0 24px; }
        .projects-grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="top-nav">
        <a href="index.html">首页</a>
        <a href="about.html">简介</a>
        <a href="projects.html" class="active">项目</a>
        <a href="blog.html">日志</a>
        <a href="friends.html">友链</a>
    </nav>

    <!-- 顶部 banner -->
    <div class="top-banner">
        <h1 class="banner-title">我的项目</h1>
        <p class="banner-subtitle">这里记录了我做过的每一个东西</p>
    </div>

    <!-- 主内容 -->
    <div class="projects-container">

        <div class="projects-grid">

            <!-- 项目卡片：思绪时刻 -->
            <a href="projects_app.html" class="project-card">
                <div class="project-cover">
                    <img src="images/app_picture.png" alt="时间管理 app">
                </div>
                <div class="project-info">
                    <h3>时间管理类 app 开发</h3>
                    <p class="project-type">时间管理类 App</p>
                    <p class="project-desc">一个规划和记录时间的工具。</p>
                    <span class="status-badge status-paused">搁置中</span>
                </div>
            </a>

            <!-- 占位卡片：敬请期待 -->
            <div class="project-card project-card-placeholder">
                <div class="project-cover">
                    <span class="placeholder-icon">🌱</span>
                </div>
                <div class="project-info">
                    <h3>敬请期待</h3>
                    <p class="project-type">More Projects</p>
                    <p class="project-desc">这里会慢慢长出更多东西。</p>
                    <span class="status-badge status-coming">计划中</span>
                </div>
            </div>

        </div>

        <p class="growing-tip">这个页面还在生长中，未来会有更多项目</p>

    </div>

</body>
</html>
